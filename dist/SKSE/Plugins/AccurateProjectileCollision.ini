; Accurate Projectile Collision - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1


[Main]
# Enable accurate collision detection for arrow projectiles.
bEnableArrow = true

# Enable accurate collision detection for spell projectiles.
bEnableSpell = true
